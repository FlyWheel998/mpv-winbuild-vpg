name: llvm toolchain
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Run custom command before building'
        required: false
        type: string

# VideoPlayerGold trim of upstream shinchiro/mpv-winbuild-cmake:
# one target (x86_64_v3), no PGO passes, no 2.4 GB toolchain artifact.
# The result lives only in this repo's Actions cache, which mpv_clang.yml restores.
jobs:
  build_llvm:
    name: Building LLVM and Clang (x86_64_v3)
    runs-on: ubuntu-latest
    container:
        image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@main
        with:
          ref: master

      - name: Loading clang root
        uses: actions/cache/restore@main
        id: clang_root_cache
        with:
          path: clang_root
          key: ${{ secrets.CACHE_VERSION }}-clang_root-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-clang_root

      - name: Loading x86_64_v3 toolchain
        uses: actions/cache/restore@main
        id: x86_64_v3_cache
        with:
          path: build_x86_64_v3
          key: ${{ secrets.CACHE_VERSION }}-clang-x86_64_v3_toolchain-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-clang-x86_64_v3_toolchain

      - name: Loading repository cache
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: ${{ secrets.CACHE_VERSION }}-repository-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-repository

      - name: Running custom command
        if: ${{ github.event.inputs.command != '' }}
        continue-on-error: true
        run: ${{ github.event.inputs.command }}

      - name: Building LLVM, rustup and the x86_64-v3 sysroot
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang -DGCC_ARCH=x86-64-v3 -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64_v3/x86_64_v3-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64_v3 -S $PWD
          ninja -C build_x86_64_v3 llvm
          ninja -C build_x86_64_v3 rustup
          ninja -C build_x86_64_v3 cargo-clean
          ninja -C build_x86_64_v3 llvm-clang

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p logs
          cp -fr $(find build_x86_64_v3 -type f -iname "*-*.log") logs || true
          7z a -m0=lzma2 -mx=9 -ms=on logs.7z logs

      - name: Uploading logs
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: llvm-logs
          path: logs.7z
          retention-days: 1

      - name: Saving clang root
        uses: actions/cache/save@main
        with:
          path: clang_root
          key: ${{ secrets.CACHE_VERSION }}-clang_root-${{ github.run_id }}

      - name: Saving x86_64_v3 toolchain
        uses: actions/cache/save@main
        with:
          path: build_x86_64_v3
          key: ${{ secrets.CACHE_VERSION }}-clang-x86_64_v3_toolchain-${{ github.run_id }}

      - name: Saving repository cache
        uses: actions/cache/save@main
        with:
          path: src_packages
          key: ${{ secrets.CACHE_VERSION }}-repository-${{ github.run_id }}

  call_workflow:
    name: Start the mpv build
    runs-on: ubuntu-latest
    needs: build_llvm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch mpv_clang.yml on master
        run: |
          gh workflow run mpv_clang.yml -R ${{ github.repository }} --ref master
